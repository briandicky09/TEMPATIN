<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" class="w-100 h-100" style="object-fit: contain; object-position: center top; display: block;">
    <defs>
        <!-- Gradients for Multi-Layered Solid Buildings -->
        <linearGradient id="farBldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#cde2f8" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#b6d5f4" stop-opacity="0.85"/>
        </linearGradient>

        <linearGradient id="midBldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e2effb" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#cbdff4" stop-opacity="0.95"/>
        </linearGradient>

        <linearGradient id="nearBldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
            <stop offset="100%" stop-color="#eaf3fb" stop-opacity="0.95"/>
        </linearGradient>

        <linearGradient id="glassWindowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0075de" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0075de" stop-opacity="0.35"/>
        </linearGradient>

        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#f0f6fc" stop-opacity="0.9"/>
        </linearGradient>

        <style>
            /* Ambient Micro-Animations */
            @keyframes heroCloudDriftA {
                0% { transform: translate(0px, 0px); }
                50% { transform: translate(26px, -3px); }
                100% { transform: translate(0px, 0px); }
            }
            @keyframes heroCloudDriftB {
                0% { transform: translate(0px, 0px); }
                50% { transform: translate(-22px, 3px); }
                100% { transform: translate(0px, 0px); }
            }
            @keyframes heroCloudDriftC {
                0% { transform: translate(0px, 0px); }
                50% { transform: translate(18px, -2px); }
                100% { transform: translate(0px, 0px); }
            }
            @keyframes heroBirdGlideA {
                0% { transform: translate(0, 0); }
                50% { transform: translate(10px, -8px); }
                100% { transform: translate(0, 0); }
            }
            @keyframes heroBirdGlideB {
                0% { transform: translate(0, 0); }
                50% { transform: translate(-9px, -6px); }
                100% { transform: translate(0, 0); }
            }
            @keyframes windowGlowPulse {
                0%, 100% { fill-opacity: 0.3; }
                50% { fill-opacity: 0.85; }
            }
            @keyframes skylineSoftFloat {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-3.5px); }
            }

            .anim-cloud-a { animation: heroCloudDriftA 16s ease-in-out infinite; will-change: transform; }
            .anim-cloud-b { animation: heroCloudDriftB 22s ease-in-out infinite; will-change: transform; }
            .anim-cloud-c { animation: heroCloudDriftC 19s ease-in-out infinite; will-change: transform; }
            
            .anim-bird-a { animation: heroBirdGlideA 6s ease-in-out infinite; will-change: transform; }
            .anim-bird-b { animation: heroBirdGlideB 7.5s ease-in-out infinite 1s; will-change: transform; }
            .anim-bird-c { animation: heroBirdGlideA 8.5s ease-in-out infinite 2s; will-change: transform; }

            .anim-glow-1 { animation: windowGlowPulse 3.5s ease-in-out infinite; }
            .anim-glow-2 { animation: windowGlowPulse 4.8s ease-in-out infinite 1.5s; }
            .anim-glow-3 { animation: windowGlowPulse 5.2s ease-in-out infinite 2.2s; }

            .anim-skyline-ambient { animation: skylineSoftFloat 11s ease-in-out infinite; will-change: transform; }
        </style>
    </defs>

    <!-- CLOUDS WITH FILLED SOLID SHAPES & SOFT BORDERS -->
    <g stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="url(#cloudGrad)">
        <!-- Cloud Top-Left -->
        <g class="anim-cloud-a">
            <path d="M 140 110 a 24 24 0 0 1 36 -12 a 32 32 0 0 1 54 4 a 22 22 0 0 1 26 20 l -116 0 z"/>
        </g>
        <!-- Cloud Mid-Left -->
        <g class="anim-cloud-b">
            <path d="M 330 175 a 26 26 0 0 1 38 -14 a 36 36 0 0 1 58 6 a 24 24 0 0 1 28 22 l -124 0 z"/>
        </g>
        <!-- Cloud Center-High -->
        <g class="anim-cloud-c">
            <path d="M 560 80 a 22 22 0 0 1 32 -10 a 30 30 0 0 1 48 4 a 20 20 0 0 1 22 18 l -102 0 z"/>
        </g>
        <!-- Cloud Mid-Right -->
        <g class="anim-cloud-a">
            <path d="M 700 185 a 18 18 0 0 1 26 -8 a 28 28 0 0 1 42 4 a 18 18 0 0 1 20 16 l -88 0 z"/>
        </g>
        <!-- Cloud Top-Right -->
        <g class="anim-cloud-b">
            <path d="M 870 95 a 28 28 0 0 1 42 -16 a 40 40 0 0 1 64 6 a 26 26 0 0 1 30 24 l -136 0 z"/>
        </g>
        <!-- Cloud Far-Left Low -->
        <g class="anim-cloud-c">
            <path d="M 45 185 a 18 18 0 0 1 28 -10 a 28 28 0 0 1 42 4 a 18 18 0 0 1 20 16 l -90 0 z"/>
        </g>
    </g>

    <!-- BIRDS IN FLIGHT -->
    <g stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g class="anim-bird-a"><path d="M 110 135 q 7 -9 14 0 q 7 -9 14 0"/></g>
        <g class="anim-bird-b"><path d="M 420 60 q 6 -8 12 0 q 6 -8 12 0"/></g>
        <g class="anim-bird-c"><path d="M 510 125 q 5 -7 10 0 q 5 -7 10 0"/></g>
        <g class="anim-bird-a"><path d="M 760 115 q 6 -8 12 0 q 6 -8 12 0"/></g>
        <g class="anim-bird-b"><path d="M 850 155 q 5 -7 10 0 q 5 -7 10 0"/></g>
        <g class="anim-bird-c"><path d="M 1010 140 q 6 -8 12 0 q 6 -8 12 0"/></g>
    </g>

    <!-- ENTIRE SOLID CITY SKYLINE WITH AMBIENT MOTION -->
    <g class="anim-skyline-ambient">

        <!-- ==========================================
             LAYER 1: DISTANT SKYLINE (SOLID SILHOUETTES)
             ========================================== -->
        <g fill="url(#farBldgGrad)" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round">
            <!-- Far Left Towers -->
            <polygon points="20,410 20,290 60,290 60,240 85,240 85,290 110,290 110,410"/>
            <polygon points="120,410 120,220 150,170 180,220 180,410"/>
            <!-- Far Mid-Left Tower with spire -->
            <polygon points="250,410 250,210 280,210 280,180 295,180 295,140 300,140 300,180 315,180 315,210 345,210 345,410"/>
            <!-- Far Center Tower (Spire behind main headline) -->
            <polygon points="460,410 460,200 490,150 500,110 510,150 540,200 540,410"/>
            <!-- Far Center Highrise with Diagonal Roof -->
            <polygon points="610,410 610,180 660,130 680,130 680,410"/>
            <!-- Far Right Tower (Clock/Broadcast Tower) -->
            <polygon points="760,410 760,220 790,220 790,160 805,160 805,120 810,120 810,160 825,160 825,220 855,220 855,410"/>
            <!-- Far Right Skyscraper -->
            <polygon points="900,410 900,230 940,190 980,230 980,410"/>
            <polygon points="1020,410 1020,260 1060,260 1060,210 1090,210 1090,260 1120,260 1120,410"/>
            <polygon points="1135,410 1135,280 1175,280 1175,410"/>
        </g>

        <!-- ==========================================
             LAYER 2: MID-GROUND SOLID SKYSCRAPERS
             ========================================== -->
        <g fill="url(#midBldgGrad)" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round">
            <!-- Mid Building 1: Stepped Modern Tower (Left) -->
            <polygon points="70,410 70,300 85,300 85,260 105,260 105,230 135,230 135,260 155,260 155,300 170,300 170,410"/>
            
            <!-- Mid Building 2: Twin Spire Highrise -->
            <polygon points="210,410 210,250 225,250 225,230 235,230 235,210 245,210 245,230 265,230 265,210 275,210 275,230 285,230 285,250 300,250 300,410"/>

            <!-- Mid Building 3: Angled Crown Skyscraper -->
            <polygon points="370,410 370,260 410,210 440,210 440,410"/>

            <!-- Mid Building 4: Grand Center Spire -->
            <polygon points="510,410 510,240 525,240 525,210 540,210 550,150 560,210 575,210 575,240 590,240 590,410"/>

            <!-- Mid Building 5: Corporate Glass Tower (Diagonal Cut) -->
            <polygon points="690,410 690,240 735,185 760,185 760,410"/>

            <!-- Mid Building 6: Stepped Residential Skyscraper -->
            <polygon points="830,410 830,270 850,270 850,240 875,240 875,215 900,215 900,240 925,240 925,270 945,270 945,410"/>

            <!-- Mid Building 7: Right Spire Tower -->
            <polygon points="980,410 980,260 1000,260 1015,190 1030,260 1050,260 1050,410"/>
        </g>

        <!-- Windows on Mid-Ground Buildings -->
        <g fill="url(#glassWindowGrad)" stroke="#94a3b8" stroke-width="0.8">
            <!-- Building 1 Window Matrix -->
            <rect x="95" y="270" width="12" height="18" rx="1"/>
            <rect x="115" y="270" width="12" height="18" rx="1"/>
            <rect x="135" y="270" width="12" height="18" rx="1"/>
            <rect x="95" y="300" width="12" height="18" rx="1" class="anim-glow-1"/>
            <rect x="115" y="300" width="12" height="18" rx="1"/>
            <rect x="135" y="300" width="12" height="18" rx="1" class="anim-glow-2"/>

            <!-- Building 3 Diagonal Windows -->
            <line x1="385" y1="260" x2="425" y2="260" stroke="#0075de" stroke-width="1.5" stroke-opacity="0.4"/>
            <line x1="385" y1="280" x2="425" y2="280" stroke="#0075de" stroke-width="1.5" stroke-opacity="0.4"/>
            <line x1="385" y1="300" x2="425" y2="300" stroke="#0075de" stroke-width="1.5" stroke-opacity="0.4"/>

            <!-- Building 5 Diagonal Slits -->
            <line x1="705" y1="230" x2="745" y2="230" stroke="#0075de" stroke-width="1.5" stroke-opacity="0.4"/>
            <line x1="705" y1="255" x2="745" y2="255" stroke="#0075de" stroke-width="1.5" stroke-opacity="0.4"/>
            <line x1="705" y1="280" x2="745" y2="280" stroke="#0075de" stroke-width="1.5" stroke-opacity="0.4"/>
            <line x1="705" y1="305" x2="745" y2="305" stroke="#0075de" stroke-width="1.5" stroke-opacity="0.4"/>

            <!-- Building 6 Grid Windows -->
            <rect x="860" y="250" width="10" height="12" rx="1"/>
            <rect x="880" y="250" width="10" height="12" rx="1" class="anim-glow-3"/>
            <rect x="900" y="250" width="10" height="12" rx="1"/>
            <rect x="860" y="270" width="10" height="12" rx="1"/>
            <rect x="880" y="270" width="10" height="12" rx="1"/>
            <rect x="900" y="270" width="10" height="12" rx="1" class="anim-glow-1"/>
        </g>

        <!-- ==========================================
             LAYER 3: FOREGROUND CRISP BUILDINGS & HOMES
             ========================================== -->
        <g fill="url(#nearBldgGrad)" stroke="#475569" stroke-width="2" stroke-linejoin="round">
            <!-- Front Building 1: Left Townhouse / Kos Block -->
            <polygon points="10,410 10,335 35,310 60,335 60,410"/>
            
            <!-- Front Building 2: Urban Kos Modern Complex with Terraces -->
            <polygon points="145,410 145,290 175,290 175,270 215,270 215,290 235,290 235,410"/>

            <!-- Front Building 3: Modern Apartment with Pitched Roof -->
            <polygon points="290,410 290,320 325,285 360,320 360,410"/>

            <!-- Front Building 4: Center-Left Block with Balconies -->
            <polygon points="420,410 420,310 470,310 470,295 500,295 500,310 535,310 535,410"/>

            <!-- Front Building 5: Modern Central Kos Building with Flat Roof & Canopy -->
            <polygon points="565,410 565,305 650,305 650,410"/>

            <!-- Front Building 6: Slanted Penthouse Residence -->
            <polygon points="665,410 665,330 710,290 745,290 745,410"/>

            <!-- Front Building 7: Multi-Level Kos Residence -->
            <polygon points="775,410 775,320 800,320 800,295 830,295 830,320 850,320 850,410"/>

            <!-- Front Building 8: Modern High-Density Kos / Studio -->
            <polygon points="890,410 890,305 925,275 960,305 960,410"/>

            <!-- Front Building 9: Residential Block with Canopy -->
            <polygon points="1030,410 1030,315 1080,315 1080,410"/>

            <!-- Front Building 10: Right Edge Residence -->
            <polygon points="1100,410 1100,340 1135,310 1170,340 1170,410 1195,410"/>
        </g>

        <!-- FOREGROUND ARCHITECTURAL DETAILS (Windows, Balconies, Doors, Trees) -->
        <g stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <!-- Front Building 1 (Left): Windows & Attic Vent -->
            <circle cx="35" cy="330" r="5" fill="#0075de" fill-opacity="0.25"/>
            <rect x="20" y="350" width="12" height="15" rx="1" fill="#0075de" fill-opacity="0.2" class="anim-glow-1"/>
            <rect x="38" y="350" width="12" height="15" rx="1" fill="#0075de" fill-opacity="0.2"/>
            <rect x="28" y="380" width="14" height="30" rx="1" fill="#cbd5e1" fill-opacity="0.6"/>

            <!-- Front Building 2 (Kos Complex): Balconies and Window Units -->
            <rect x="160" y="300" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-2"/>
            <line x1="155" y1="323" x2="183" y2="323" stroke-width="2"/>
            <rect x="190" y="300" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <line x1="185" y1="323" x2="213" y2="323" stroke-width="2"/>
            
            <rect x="160" y="340" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <line x1="155" y1="363" x2="183" y2="363" stroke-width="2"/>
            <rect x="190" y="340" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-3"/>
            <line x1="185" y1="363" x2="213" y2="363" stroke-width="2"/>

            <rect x="165" y="380" width="30" height="30" rx="2" fill="#0075de" fill-opacity="0.15"/>

            <!-- Front Building 3 (Apartment with Pitched Roof): Window Grid -->
            <rect x="305" y="330" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.22" class="anim-glow-1"/>
            <rect x="330" y="330" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.22"/>
            <rect x="305" y="365" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.22"/>
            <rect x="330" y="365" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.22" class="anim-glow-2"/>

            <!-- Front Building 4: Balcony Sets -->
            <rect x="435" y="325" width="22" height="22" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <line x1="430" y1="350" x2="462" y2="350" stroke-width="2.2"/>
            <rect x="475" y="325" width="22" height="22" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-3"/>
            <line x1="470" y1="350" x2="502" y2="350" stroke-width="2.2"/>

            <rect x="435" y="365" width="22" height="22" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-1"/>
            <line x1="430" y1="390" x2="462" y2="390" stroke-width="2.2"/>
            <rect x="475" y="365" width="22" height="22" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <line x1="470" y1="390" x2="502" y2="390" stroke-width="2.2"/>

            <!-- Front Building 5 (Central Flat Roof): Modern Horizontal Window Ribbons -->
            <rect x="580" y="320" width="55" height="15" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <line x1="598" y1="320" x2="598" y2="335" stroke="#475569" stroke-width="1.2"/>
            <line x1="616" y1="320" x2="616" y2="335" stroke="#475569" stroke-width="1.2"/>

            <rect x="580" y="348" width="55" height="15" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-2"/>
            <line x1="598" y1="348" x2="598" y2="363" stroke="#475569" stroke-width="1.2"/>
            <line x1="616" y1="348" x2="616" y2="363" stroke="#475569" stroke-width="1.2"/>

            <rect x="580" y="375" width="55" height="15" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <line x1="598" y1="375" x2="598" y2="390" stroke="#475569" stroke-width="1.2"/>
            <line x1="616" y1="375" x2="616" y2="390" stroke="#475569" stroke-width="1.2"/>

            <!-- Rooftop AC and Antennas on Building 5 -->
            <rect x="590" y="295" width="16" height="10" rx="1" fill="#cbd5e1"/>
            <rect x="615" y="295" width="12" height="10" rx="1" fill="#cbd5e1"/>

            <!-- Front Building 6: Slanted Penthouse Windows -->
            <rect x="680" y="340" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.22"/>
            <rect x="710" y="340" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.22" class="anim-glow-1"/>
            <rect x="680" y="375" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.22" class="anim-glow-3"/>
            <rect x="710" y="375" width="18" height="20" rx="2" fill="#0075de" fill-opacity="0.22"/>

            <!-- Front Building 7: Multi-tier Balconies -->
            <rect x="790" y="335" width="16" height="18" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <rect x="815" y="335" width="16" height="18" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-2"/>
            <rect x="790" y="370" width="16" height="18" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <rect x="815" y="370" width="16" height="18" rx="2" fill="#0075de" fill-opacity="0.25"/>

            <!-- Front Building 8 (Kos Studio): Windows -->
            <rect x="905" y="325" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-1"/>
            <rect x="930" y="325" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <rect x="905" y="360" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <rect x="930" y="360" width="16" height="20" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-2"/>

            <!-- Front Building 9: Horizontal Louvers -->
            <rect x="1045" y="335" width="22" height="18" rx="2" fill="#0075de" fill-opacity="0.25"/>
            <rect x="1045" y="365" width="22" height="18" rx="2" fill="#0075de" fill-opacity="0.25" class="anim-glow-3"/>

            <!-- Front Building 10: Right Residence -->
            <rect x="1115" y="350" width="14" height="18" rx="2" fill="#0075de" fill-opacity="0.2"/>
            <rect x="1140" y="350" width="14" height="18" rx="2" fill="#0075de" fill-opacity="0.2"/>

            <!-- TREES & GREENERY BETWEEN BUILDINGS -->
            <!-- Tree 1 between Bldg 1 and 2 -->
            <path d="M 62 410 L 62 385 Q 52 375 62 360 Q 72 375 62 385" fill="#10b981" fill-opacity="0.3" stroke="#059669" stroke-width="1.4"/>
            <!-- Tree 2 between Bldg 3 and 4 -->
            <path d="M 390 410 L 390 380 Q 378 368 390 350 Q 402 368 390 380" fill="#10b981" fill-opacity="0.3" stroke="#059669" stroke-width="1.4"/>
            <!-- Tree 3 between Bldg 6 and 7 -->
            <path d="M 760 410 L 760 382 Q 748 370 760 352 Q 772 370 760 382" fill="#10b981" fill-opacity="0.3" stroke="#059669" stroke-width="1.4"/>
            <!-- Tree 4 between Bldg 8 and 9 -->
            <path d="M 995 410 L 995 380 Q 982 368 995 350 Q 1008 368 995 380" fill="#10b981" fill-opacity="0.3" stroke="#059669" stroke-width="1.4"/>

            <!-- SOLID GROUND BASELINE -->
            <line x1="0" y1="410" x2="1200" y2="410" stroke="#334155" stroke-width="3"/>
        </g>
    </g>
</svg>
